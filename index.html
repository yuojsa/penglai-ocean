<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>蓬莱海境</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc4dd; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%);
    font: 13px/1.4 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: rgba(255,255,255,.92); letter-spacing: .04em; white-space: nowrap;
    padding: 7px 16px; border-radius: 999px;
    background: rgba(8,40,60,.32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-shadow: 0 1px 2px rgba(0,0,0,.35); pointer-events: none; transition: opacity .6s;
  }
  #hint b { font-weight: 600; }
  #weather { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 5px;
    border-radius: 999px; background: rgba(8,24,40,.34); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #weather button { font: 13px/1 -apple-system, "PingFang SC", sans-serif; letter-spacing: .08em; color: rgba(255,255,255,.82);
    background: transparent; border: 0; padding: 8px 15px; border-radius: 999px; cursor: pointer; transition: background .25s, color .25s; }
  #weather button:hover { background: rgba(255,255,255,.14); }
  #weather button.on { background: rgba(255,255,255,.88); color: #12283a; }
  #weather button.snd { color: rgba(255,255,255,.6); font-size: 12px; }
  #cam { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px;
    border-radius: 999px; background: rgba(8,24,40,.26); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #cam button { font: 12px/1 -apple-system, "PingFang SC", sans-serif; letter-spacing: .06em; color: rgba(255,255,255,.78);
    background: transparent; border: 0; padding: 6px 11px; border-radius: 999px; cursor: pointer; transition: background .25s, color .25s; }
  #cam button:hover { background: rgba(255,255,255,.14); }
  #cam button.on { background: rgba(255,255,255,.82); color: #12283a; }
  #cam button.view { color: rgba(255,255,255,.6); }
  #who { position: fixed; left: 16px; bottom: 18px; font: 12px/1.4 -apple-system, "PingFang SC", sans-serif; color: rgba(255,255,255,.85);
    padding: 6px 12px; border-radius: 999px; background: rgba(8,24,40,.32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); letter-spacing: .05em; }
  #hint { max-width: 94vw; white-space: normal !important; text-align: center; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 15px -apple-system, "PingFang SC", sans-serif; color: #fff; letter-spacing: .2em;
    background: linear-gradient(#5d9fd0, #b9d8e8); transition: opacity .8s;
  }

  /* ---------- small screens + touch ---------- */
  html, body { overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #weather, #cam { max-width: calc(100vw - 16px); box-sizing: border-box; overflow-x: auto; scrollbar-width: none; }
  #weather::-webkit-scrollbar, #cam::-webkit-scrollbar { display: none; }
  #weather button, #cam button { flex: 0 0 auto; white-space: nowrap; }
  #weather { top: calc(10px + env(safe-area-inset-top)); }
  #cam { top: calc(56px + env(safe-area-inset-top)); }
  #hint .tc, #touch { display: none; }
  #stick { position: fixed; left: calc(18px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 112px; height: 112px; border-radius: 50%;
    background: rgba(8,24,40,.28); border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.75); pointer-events: none; }
  #pads { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 9px; }
  #pads button { width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); background: rgba(8,24,40,.34); color: #fff;
    font: 13px/1 -apple-system, "PingFang SC", sans-serif; letter-spacing: .04em; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); touch-action: manipulation; }
  #pads button:active { background: rgba(255,255,255,.7); color: #12283a; }
  @media (pointer: coarse) {
    #touch { display: block; }
    #hint .kb { display: none; } #hint .tc { display: inline; }
    #hint { bottom: auto; top: calc(134px + env(safe-area-inset-top)); font-size: 12px; padding: 6px 12px; }
    #who { left: 50%; transform: translateX(-50%); bottom: auto; top: calc(100px + env(safe-area-inset-top)); white-space: nowrap; font-size: 11px; padding: 5px 10px; }
  }
  @media (max-width: 520px) {
    #weather button { padding: 8px 12px; }
    #cam button { padding: 6px 8px; letter-spacing: 0; }
  }
  @media (pointer: coarse) and (max-height: 480px) {            /* phone held sideways */
    #hint { top: calc(96px + env(safe-area-inset-top)); } #who { top: auto; bottom: calc(10px + env(safe-area-inset-bottom)); }
    #stick { width: 96px; height: 96px; } #pads { flex-direction: row; }
  }

  /* ---------- keep the picture clear ---------- */
  #weather, #cam, #touch { transition: opacity .35s; }
  body.ui-off #weather, body.ui-off #cam { opacity: 0; pointer-events: none; }
  #hint.gone, body.ui-off #hint { opacity: 0 !important; }
  #who { opacity: 0; transition: opacity .3s; pointer-events: none; }
  #who.show { opacity: 1; }
  #ui-toggle { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); width: 34px; height: 34px; border-radius: 50%; z-index: 5;
    border: 0; background: rgba(8,24,40,.30); color: rgba(255,255,255,.85); font-size: 15px; line-height: 34px; padding: 0; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #stick, #pads button { opacity: .55; } #stick:active, #pads button:active { opacity: 1; }
  #pads button { width: 46px; height: 46px; font-size: 12px; }
  #stick { width: 100px; height: 100px; }
  @media (pointer: coarse) {
    #weather { left: calc(8px + env(safe-area-inset-left)); transform: none; max-width: calc(100vw - 62px); padding: 3px; }
    #weather button { padding: 6px 10px; font-size: 12px; }
    #cam { top: calc(46px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); transform: none; padding: 3px; }
    #cam button { padding: 5px 8px; font-size: 11px; }
    #hint { top: calc(84px + env(safe-area-inset-top)); }
    #who { top: auto; bottom: calc(26px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="loading">云开见蓬莱…</div>
<button id="ui-toggle" aria-label="显示或隐藏菜单">☰</button>
<div id="weather"></div>
<div id="cam"></div>
<div id="who"></div>
<div id="hint"><span class="kb">左键旋转 · 滚轮缩放 · <b>C</b> 自由镜头（右键拖动平移，按住右键 + <b>W A S D Q E</b> 飞行）· <b>V</b> 切视角 · <b>F</b> 回到船 · <b>W A S D</b> 开船 · <b>R</b> 巡航 · <b>1 2 3</b> 天气 · <b>G</b> 动作 · <b>B</b> 表情 · <b>H</b> 隐藏</span><span class="tc">单指拖动旋转 · 双指缩放 · 左下摇杆开船</span></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div id="pads"><button data-k="r">巡航</button><button data-k="g">动作</button><button data-k="b">表情</button></div></div>
